[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_dydx"
version = "0.15.0"
description = "dYdX exchange plugin for bt_api"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15,<1.0",
]

[project.entry-points."bt_api.plugins"]
dydx = "bt_api_dydx.plugin:register_plugin"

[project.entry-points."bt_api.order_identity_projections"]
DYDX___SPOT = "bt_api_base.order_identity_projection:project_legacy_order_identity"
DYDX___SWAP = "bt_api_base.order_identity_projection:project_legacy_order_identity"

[project.entry-points."bt_api.order_request_projections"]
DYDX___SPOT = "bt_api_base.order_request_projection:legacy_order_request_projection"
DYDX___SWAP = "bt_api_base.order_request_projection:legacy_order_request_projection"

[project.entry-points."bt_api.order_quantity_unit_validators"]
DYDX___SPOT = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
DYDX___SWAP = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bt_api_dydx"]

[project.entry-points."bt_api.fee_projections"]
DYDX___SPOT = "bt_api_base.fee_projection:legacy_fee_projection"
DYDX___SWAP = "bt_api_base.fee_projection:legacy_fee_projection"

[project.entry-points."bt_api.order_side_projections"]
DYDX___SPOT = "bt_api_base.order_side_projection:legacy_order_side_candidates"
DYDX___SWAP = "bt_api_base.order_side_projection:legacy_order_side_candidates"

[project.entry-points."bt_api.normalization_policies"]
DYDX___SPOT = "bt_api_dydx.normalization_policy:normalization_policy"
DYDX___SWAP = "bt_api_dydx.normalization_policy:normalization_policy"

[project.entry-points."bt_api.execution_configuration_policies"]
DYDX___SPOT = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"
DYDX___SWAP = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"

[project.entry-points."bt_api.execution_ledger_identity_policies"]
DYDX = "bt_api_base.execution_ledger_identity_policy:legacy_ledger_policy"

[project.entry-points."bt_api.account_risk_source_policies"]
DYDX = "bt_api_base.account_risk_source_policy:legacy_account_risk_source_policy"
